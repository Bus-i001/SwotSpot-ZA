<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subject | SwotSpot ZA</title>
<meta name="description" content="Browse free study guides, mind maps and worksheets by subject on SwotSpot ZA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.grade-switch{display:flex;gap:.6rem;margin:1rem 0}
.grade-switch button{flex:1;font:inherit;font-weight:800;font-size:1.1rem;padding:.8rem 1rem;border-radius:12px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.grade-switch button[aria-pressed="true"]{background:var(--ink);color:#fff}
.grade-switch button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
</style>
</head>
<body>
<header class="site"><div class="wrap">
<a class="logo" href="index.html">Swot<span>Spot</span> ZA</a>
<nav></nav>
</div></header>

<main class="wrap">
<p class="crumbs"><a href="index.html">Home</a> / <a id="gradelink" href="resources.html">Resources</a> / <span id="crumb">Subject</span></p>
<h1 id="title">Subject</h1>
<p><span class="tag" id="ctag"></span><span class="tag" id="gtag"></span></p>

<div class="grade-switch" role="group" aria-label="Choose a grade">
<button type="button" id="b8" aria-pressed="false">Grade 8</button>
<button type="button" id="b9" aria-pressed="false">Grade 9</button>
</div>

<div id="lists"></div>
<noscript><p class="empty">Please turn on JavaScript to see the topic list.</p></noscript>

<!-- AD SLOT: paste your AdSense unit here after approval -->
<div class="ad-slot"><span class="ad-label">Advertisement</span></div>
</main>

<footer class="site"><div class="wrap">
<p><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms</a></p>
<p>SwotSpot ZA is an independent study site. It is not affiliated with the Department of Basic Education or the IEB.</p>
</div></footer>

<script src="topics-data.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var c = q.get('c') === 'ieb' ? 'ieb' : 'caps';
  var s = (q.get('s') || '').replace(/[^a-z0-9-]/g, '');
  var name = q.get('n') || 'Subject';
  var grade = q.get('g') === '9' ? '9' : '8';
  var label = c.toUpperCase();

  var box = document.getElementById('lists');
  var b8 = document.getElementById('b8');
  var b9 = document.getElementById('b9');

  document.getElementById('ctag').textContent = label;
  document.getElementById('ctag').className = 'tag ' + c;
  document.getElementById('crumb').textContent = name + ' ' + label;

  function render() {
    document.title = 'Grade ' + grade + ' ' + name + ' (' + label + ') | SwotSpot ZA';
    document.getElementById('title').textContent = 'Grade ' + grade + ' ' + name + ' (' + label + ')';
    document.getElementById('gtag').textContent = 'Grade ' + grade;
    document.getElementById('gradelink').href = 'grade-' + grade + '.html';
    document.getElementById('gradelink').textContent = 'Grade ' + grade;
    b8.setAttribute('aria-pressed', grade === '8' ? 'true' : 'false');
    b9.setAttribute('aria-pressed', grade === '9' ? 'true' : 'false');

    box.textContent = '';
    var list = (window.TOPICS || {})[c + '-' + s + '-' + grade] || [];
    if (!list.length) {
      var p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'Grade ' + grade + ' ' + name + ' topics are coming soon. Check back shortly.';
      box.appendChild(p);
      return;
    }
    var ul = document.createElement('ul');
    ul.className = 'topic-list';
    list.forEach(function (t) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = t.url;
      a.textContent = t.title;
      li.appendChild(a);
      ul.appendChild(li);
    });
    box.appendChild(ul);
  }

  function choose(g) {
    grade = g;
    q.set('g', g);
    try { history.replaceState(null, '', location.pathname + '?' + q.toString()); } catch (e) {}
    render();
  }

  b8.onclick = function () { choose('8'); };
  b9.onclick = function () { choose('9'); };
  render();
})();
</script>
<script src="site.js" defer></script>
</body>
  </html>
